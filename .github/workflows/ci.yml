name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: docs guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      # The skip check is the point of this step, not decoration. A test that
      # skips reports success having asserted nothing, which is the exact
      # silent-success shape tests/test_docs_integrity.py exists to catch.
      # Nothing in the guard has a legitimate reason to skip, so any skip is
      # a failure.
      #
      # This runs in CI MODE: the maintainer's working half is gitignored, so
      # the runner cannot see docs/, CLAUDE.md or BACKLOG.html. The guard knows,
      # and inverts -- instead of checking the page's contents it checks the
      # page is absent and that git confirms that is deliberate. Do not "fix" a
      # [CI] line in the output; it is the guard reporting which half it saw.
      - name: Docs guard
        shell: bash
        run: |
          # Both, explicitly. GitHub runs `shell: bash` steps with -eo pipefail
          # already, and this script RELIES on the -e: a genuine test failure
          # must abort at the pipe. Without it the `if` below evaluates false
          # and the step exits 0, masking the failure. Stated here so copying
          # this step somewhere with a different shell cannot resurrect that.
          #
          # The path is explicit, not bare `pytest`: this job guards the docs
          # and must not collect the project's own tests. Once a project adds
          # tests/test_*.py, a bare `pytest -v -rs` here would run them too --
          # without the project's dependencies installed, and failing this job
          # on any legitimate project-test skip while blaming the docs guard
          # for it. The project's suite gets its own job below, with its own
          # dependencies.
          set -eo pipefail
          pytest -v -rs tests/test_docs_integrity.py | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::Tests were skipped — the suite may be vacuous."
            exit 1
          fi

  extension:
    name: extension (typecheck, unit, build, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # Two builds: the store build must carry no host_permissions; the e2e build
      # adds localhost so Playwright can skip Chrome's permission prompt.
      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          npm run build
          if grep -q '"host_permissions"' .output/chrome-mv3/manifest.json; then
            echo "::error::The store build has host_permissions."
            exit 1
          fi
          npm run build:e2e

      # Firefox: same no-host_permissions rule, then Mozilla's own linter (what AMO runs).
      - name: Firefox build and lint
        shell: bash
        run: |
          set -eo pipefail
          npm run build:firefox
          if grep -q '"host_permissions"' .output/firefox-mv3/manifest.json; then
            echo "::error::The Firefox build has host_permissions."
            exit 1
          fi
          npx web-ext lint --source-dir .output/firefox-mv3

      # Same skip rule as the docs guard: a skip is an assertion that did not run.
      - name: Unit tests
        shell: bash
        run: |
          set -eo pipefail
          npx vitest run | tee vitest.out
          if grep -qiE '[0-9]+ (skipped|todo)' vitest.out; then
            echo "::error::Unit tests were skipped."
            exit 1
          fi

      - name: End-to-end tests
        shell: bash
        run: |
          set -eo pipefail
          npx playwright test | tee e2e.out
          if grep -qiE '[0-9]+ skipped' e2e.out; then
            echo "::error::End-to-end tests were skipped."
            exit 1
          fi
