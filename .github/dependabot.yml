# Dependabot opens a pull request when something this repository depends on has a newer version.
# Each one arrives with a CI run, so an update is judged by evidence, not by its version number.
version: 2
updates:
  # The actions the workflows use. They are pinned by commit hash; Dependabot moves the hash
  # and the version comment beside it together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One pull request a week for all of them, not one each.
      actions:
        patterns: ["*"]

  # The extension's own tools and libraries, from package.json and package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Fixes and small updates arrive together; a new major version gets a pull request of its own,
      # because it is the one most likely to need a change in the code.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
