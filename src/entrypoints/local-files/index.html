<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixel Veil on local files</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #1f2328;
        font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .header-icon {
        width: 32px;
        height: 32px;
        display: block;
      }
      .header-title {
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
      }
      p {
        margin: 0 0 12px 0;
        line-height: 1.5;
      }
      button {
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
        background: #0969da;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 6px 16px;
        font-weight: bold;
        cursor: pointer;
        display: inline-block;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
